[pytest]
# WebWise AI — pytest configuration
# ====================================
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Custom markers
# Use: pytest -m integration   (run only integration tests)
# Use: pytest -m "not integration"  (skip integration tests)
markers =
    integration: marks tests requiring a live Ollama instance (deselect with '-m "not integration"')

# Show short test summary at the end
addopts = -v --tb=short -m "not integration"

# Asyncio mode (for any async tests we add later)
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
